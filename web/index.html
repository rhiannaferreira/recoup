<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recoup</title>
  <meta name="description" content="Find money you're owed on medical bills and leases, with the proof and the deadline for each right.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="/" id="home">Recoup</a>
    <nav>
      <span class="crumb" id="crumb"></span>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button id="bigText" class="text-btn" aria-pressed="false" title="Larger text">Aa</button>
    </nav>
  </header>

  <main>
    <!-- 1. Start -->
    <section id="start" class="step">
      <div class="dropzone" aria-hidden="true"><span data-i18n="start.drop"></span></div>
      <div class="intro">
        <div class="intro-copy">
          <h1 data-i18n-html="start.h1"></h1>
          <p class="lede" data-i18n="start.lede"></p>
          <div class="cta">
            <button id="demo" class="btn btn-solid"><span data-i18n="start.demo"></span> <span aria-hidden="true">→</span></button>
            <label class="btn btn-quiet">
              <span data-i18n="start.upload"></span>
              <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.heic,.txt,.json,image/*" hidden>
            </label>
          </div>
          <button id="resume" class="text-btn" hidden data-i18n="start.resume"></button>
          <p class="note" id="startNote" data-i18n="start.note"></p>
        </div>

        <figure class="specimen" aria-hidden="true">
          <div class="slip">
            <div class="slip-head"><span>Front Range Community Hospital</span><span>Stmt 08/12</span></div>
            <div class="slip-row"><span>99285 ED visit, high</span><span>2,400.00</span></div>
            <div class="slip-row"><span>71046 Chest X-ray ×2</span><span>380.00</span></div>
            <div class="slip-row"><span>85025 Blood count</span><span>85.00</span></div>
            <div class="slip-row struck"><span>85025 Blood count</span><span>85.00</span></div>
            <div class="slip-row"><span>ER supplies</span><span>595.00</span></div>
            <div class="slip-total"><span>Balance due</span><span>4,100.00</span></div>
            <div class="stamp">23 days<br><small>to dispute</small></div>
          </div>
        </figure>
      </div>

      <ol class="steps">
        <li><span class="num">01</span><strong data-i18n="start.s1"></strong><p data-i18n="start.s1p"></p></li>
        <li><span class="num">02</span><strong data-i18n="start.s2"></strong><p data-i18n="start.s2p"></p></li>
        <li><span class="num">03</span><strong data-i18n="start.s3"></strong><p data-i18n="start.s3p"></p></li>
      </ol>
    </section>

    <!-- 2. Confirm -->
    <section id="confirm" class="step" hidden>
      <div class="section-head">
        <p class="eyebrow" data-i18n="confirm.eyebrow"></p>
        <h2 data-i18n="confirm.h2"></h2>
        <p class="lede" data-i18n="confirm.lede"></p>
      </div>
      <form id="details" class="details" autocomplete="off">
        <div class="details-head">
          <h3 data-i18n="details.h"></h3>
          <p class="note" data-i18n="details.why"></p>
        </div>
        <label><span data-i18n="details.name"></span><input name="name" type="text"></label>
        <label><span data-i18n="details.state"></span><select name="state" id="stateSelect"></select></label>
        <label><span data-i18n="details.household"></span><input name="household_size" type="number" min="1" max="20" inputmode="numeric"></label>
        <label><span data-i18n="details.income"></span>
          <span class="money-input"><span aria-hidden="true">$</span><input name="annual_income" type="number" min="0" step="1000" inputmode="numeric"></span></label>
      </form>
      <div id="docs"></div>
      <div class="bar-end">
        <span class="note" id="lineCount"></span>
        <button id="run" class="btn btn-solid"><span data-i18n="confirm.run"></span> <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <!-- 3. Results -->
    <section id="results" class="step" hidden>
      <div class="summary">
        <div>
          <p class="eyebrow" id="caseLine"></p>
          <div class="figure"><span id="total"></span><span class="figure-label" data-i18n="results.recoverable"></span></div>
        </div>
        <dl class="stats" id="stats"></dl>
      </div>
      <div class="toolbar">
        <button id="openPacket" class="btn btn-quiet" data-i18n="results.packet"></button>
        <button id="calendar" class="btn btn-quiet" data-i18n="results.calendar"></button>
      </div>

      <div class="block">
        <div class="block-head">
          <h2 data-i18n="results.clock"></h2>
          <p class="note" data-i18n="results.clockNote"></p>
        </div>
        <div class="timeline" id="timeline"></div>
        <ol class="clock" id="clock"></ol>
      </div>

      <div class="block">
        <div class="block-head">
          <h2 data-i18n="results.findings"></h2>
          <p class="note" id="rulesNote"></p>
        </div>
        <div class="ledger" id="findings"></div>
      </div>
    </section>

    <!-- 4. Evidence packet (print view) -->
    <section id="packet" class="step" hidden>
      <div class="packet-bar no-print">
        <button id="packetBack" class="text-btn" data-i18n="packet.back"></button>
        <button id="print" class="btn btn-solid" data-i18n="packet.print"></button>
      </div>
      <div id="packetBody"></div>
    </section>
    <!-- About -->
    <section id="about" class="step" hidden>
      <div class="section-head">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h2 data-i18n="about.h"></h2>
        <p class="lede" data-i18n="about.lede"></p>
      </div>
      <div class="about-grid">
        <div><h3 data-i18n="about.rules.h"></h3><p data-i18n="about.rules.p"></p></div>
        <div><h3 data-i18n="about.ai.h"></h3><p data-i18n="about.ai.p"></p></div>
        <div><h3 data-i18n="about.total.h"></h3><p data-i18n="about.total.p"></p></div>
        <div><h3 data-i18n="about.privacy.h"></h3><p data-i18n="about.privacy.p"></p></div>
      </div>
      <h3 class="about-sub" data-i18n="about.packs"></h3>
      <table class="lines" id="packsTable"></table>
      <h3 class="about-sub" data-i18n="about.data"></h3>
      <table class="lines" id="sourcesTable"></table>
      <h3 class="about-sub" data-i18n="about.limits.h"></h3>
      <ul class="limits" id="limits"></ul>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n="start.note"></span>
    <a href="#about" id="aboutLink" data-i18n="about.link"></a>
  </footer>

  <aside id="sheet" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-scrim" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <div>
          <p class="eyebrow" data-i18n="sheet.eyebrow"></p>
          <h2 id="sheetTitle"></h2>
          <p class="note" id="englishNote" hidden data-i18n="sheet.englishNote"></p>
        </div>
        <button class="text-btn" data-close data-i18n="sheet.close"></button>
      </div>
      <div class="sheet-tabs" role="tablist">
        <button role="tab" aria-selected="true" data-view="preview" data-i18n="sheet.preview"></button>
        <button role="tab" aria-selected="false" data-view="edit" data-i18n="sheet.edit"></button>
      </div>
      <article id="draftPreview" class="paper"></article>
      <textarea id="draftText" class="paper paper-edit" hidden spellcheck="true" aria-label="Draft text"></textarea>
      <div class="sheet-foot">
        <div class="sheet-tools">
          <button id="readAloud" class="text-btn" data-i18n="sheet.read"></button>
          <button id="copy" class="text-btn" data-i18n="sheet.copy"></button>
          <button id="download" class="text-btn" data-i18n="sheet.download"></button>
        </div>
        <button id="approve" class="btn btn-solid" data-i18n="sheet.approve"></button>
      </div>
    </div>
  </aside>

  <script src="/app.js" type="module"></script>
</body>
</html>
